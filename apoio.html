<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apoio — XV Simpósio de Tecnologia da Informação</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e061a" />

  <!-- Favicon -->
  <link rel="icon" href="assets/images/UegLogoSimples.ico" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <!-- Estilos personalizados (mesmo design system do site) -->
  <link rel="stylesheet" href="assets/css/styles.css" />

  <style>
    /* Página feita para telão/projeção: uma tela só, sem rolagem em telas grandes */
    html, body { height: 100%; }
  </style>
</head>

<body class="bg-dark-bg text-slate-200 font-sans">
  <div class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden px-4 py-12 sm:py-16">
    <!-- Fundo: mesma arte e tratamento do hero da página inicial -->
    <div class="absolute inset-0">
      <img src="assets/images/WallpaperFundo.jpg"
           alt="Rede de IA, circuitos e microprocessador representando tecnologia da informação"
           class="hero-img w-full h-full"
           loading="eager" />
      <div class="hero-overlay absolute inset-0"></div>
    </div>

    <div class="relative z-10 w-full max-w-5xl text-center">
      <!-- Nome do Simpósio e da Semana, em cima, igual à página inicial -->
      <h1 class="text-3xl sm:text-5xl md:text-6xl font-black">
        XV Simpósio de Tecnologia da Informação
      </h1>
      <p class="hero-sub mt-3 text-sm sm:text-base md:text-lg">
        XVIII Semana de Iniciação Científica do Curso de Sistemas de Informação
      </p>
      <p class="hero-date mt-2 text-base sm:text-lg">15 a 17 de setembro de 2026</p>

      <!-- Apoio institucional -->
      <div class="mt-10 sm:mt-14 md:mt-16">
        <h2 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-white">Apoio</h2>

        <div class="mt-6 sm:mt-8 grid sm:grid-cols-3 gap-4 sm:gap-6 max-w-4xl mx-auto">
          <article class="bg-dark-card/80 border border-white/10 rounded-2xl p-5 sm:p-6 shadow-glow flex flex-col items-center justify-center text-center">
            <div class="inline-flex items-center justify-center rounded-lg bg-white p-3 sm:p-4 shadow-glow">
              <img src="assets/images/Logo%20PrP.png"
                   alt="Logo da Pró-Reitoria de Pesquisa e Pós-Graduação da UEG (PRP/UEG)"
                   class="max-h-12 sm:max-h-16 max-w-[200px] sm:max-w-[240px] w-auto object-contain" loading="eager" />
            </div>
            <p class="mt-3 sm:mt-4 text-sm sm:text-base font-semibold text-white">Pró-Reitoria de Pesquisa e Pós-Graduação</p>
          </article>

          <article class="bg-dark-card/80 border border-white/10 rounded-2xl p-5 sm:p-6 shadow-glow flex flex-col items-center justify-center text-center">
            <div class="inline-flex items-center justify-center rounded-lg bg-white p-3 sm:p-4 shadow-glow">
              <img src="assets/images/logo%20editora%20ueg.png"
                   alt="Logo da Editora UEG"
                   class="max-h-10 sm:max-h-14 max-w-[165px] sm:max-w-[200px] w-auto object-contain" loading="eager" />
            </div>
            <p class="mt-3 sm:mt-4 text-sm sm:text-base font-semibold text-white">Editora UEG</p>
          </article>

          <article class="bg-dark-card/80 border border-white/10 rounded-2xl p-5 sm:p-6 shadow-glow flex flex-col items-center justify-center text-center">
            <div class="inline-flex items-center justify-center rounded-full bg-ueg-gold/10 w-14 h-14 sm:w-20 sm:h-20">
              <i data-lucide="graduation-cap" class="text-ueg-gold w-7 h-7 sm:w-10 sm:h-10"></i>
            </div>
            <p class="mt-3 sm:mt-4 text-sm sm:text-base font-semibold text-white">Docentes do Curso de Sistemas de Informação</p>
          </article>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.js" defer></script>
  <script>
    window.addEventListener('load', () => {
      if (window.lucide && lucide.createIcons) lucide.createIcons();
    });
  </script>
</body>
</html>
